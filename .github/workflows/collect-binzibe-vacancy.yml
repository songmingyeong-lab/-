name: Collect Binzibe vacancy aggregates

on:
  schedule:
    - cron: "23 18 1 * *"
  workflow_dispatch:

concurrency:
  group: collect-binzibe-vacancy
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DATA_MODE: live
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SAVE_RAW_RESPONSES: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: python scripts/collect_binzibe_vacancy.py --all-targets --request-delay 1
      - run: python scripts/process_binzibe_indicators.py
      - run: npm run db:generate
      - run: npm run collect:live -- --source vacant-house

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binzibe-aggregate-collection-${{ github.run_id }}
          path: |
            data/raw/binzibe/
            data/processed/binzibe_*
            data/metadata/binzibe_*
          retention-days: 30
          if-no-files-found: warn
